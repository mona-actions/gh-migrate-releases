name: build
on:
  push:
    branches:
      - main
    paths-ignore:
      - "*.md"
  pull_request:
    branches:
      - main
    paths-ignore:
      - "*.md"
jobs:
  build-and-test:
    runs-on: ubuntu-latest
    concurrency:
      group: build-${{ github.ref }}
      cancel-in-progress: true
    permissions: read-all
    env:
      CI: true
    steps:
      - uses: actions/checkout@0ad4b8fadaa221de15dcec353f45205ec38ea70b #v4.1.4
      - uses: actions/setup-go@cdcb36043654635271a94b9a6d1392de5bb323a7 #v5.0.1
        with:
          go-version: 1.21
      - name: Download dependencies
        run: go get -v -t -d ./...
      - run: go build -v .
      - name: Run unit tests
        run: go test ./... -v -race -coverprofile=coverage.out
      - name: Generate coverage report
        run: go tool cover -func=coverage.out
      - name: Generate coverage summary for GitHub
        run: |
          echo "## 📊 Test Coverage Report" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### Overall Coverage" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          
          # Get total coverage percentage
          TOTAL_COVERAGE=$(go tool cover -func=coverage.out | grep total | awk '{print $3}')
          echo "**Total Coverage: $TOTAL_COVERAGE**" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          
          # Create table header
          echo "| Package | Function | Coverage |" >> $GITHUB_STEP_SUMMARY
          echo "|---------|----------|----------|" >> $GITHUB_STEP_SUMMARY
          
          # Parse coverage output and create table rows
          go tool cover -func=coverage.out | grep -v "total:" | while IFS= read -r line; do
            if [ ! -z "$line" ]; then
              PACKAGE=$(echo "$line" | awk '{print $1}' | sed 's/.*\///')
              FUNCTION=$(echo "$line" | awk '{print $2}')
              COVERAGE=$(echo "$line" | awk '{print $3}')
              echo "| $PACKAGE | $FUNCTION | $COVERAGE |" >> $GITHUB_STEP_SUMMARY
            fi
          done
          
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### Test Results" >> $GITHUB_STEP_SUMMARY
          echo "✅ All tests passed successfully!" >> $GITHUB_STEP_SUMMARY
      - name: Upload coverage to artifacts
        uses: actions/upload-artifact@65462800fd760344b1a7b4382951275a0abb4808 #v4.3.3
        with:
          name: coverage-report
          path: coverage.out
          retention-days: 30
